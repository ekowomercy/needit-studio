services:
  db:
    image: postgis/postgis:16-3.4
    container_name: needit-db
    environment:
      POSTGRES_USER: needit
      POSTGRES_PASSWORD: needit
      POSTGRES_DB: needit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needit -d needit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: needit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: