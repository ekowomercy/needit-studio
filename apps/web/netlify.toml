[build]
  base = "apps/web"
  command = "pnpm --filter @needit/web build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

[context.production.environment]
  NEXT_PUBLIC_API_URL = ""

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
