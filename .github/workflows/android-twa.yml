name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "twa/**"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twa
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'needitstudio' }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'needitstudio' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Set up Android SDK for Bubblewrap
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "JDK: $JAVA_HOME"
          echo "SDK: $SDK"
          # Bubblewrap requires the SDK path to contain a 'tools/' (or 'bin/') folder.
          sudo ln -sfn "$SDK/cmdline-tools/latest" "$SDK/tools"
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          # Accept licenses and install the components Bubblewrap + Gradle need.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Wait for PWA assets to be live
        run: |
          for url in \
            "https://needit-studio.netlify.app/icon-512.png" \
            "https://needit-studio.netlify.app/notification-icon.png"; do
            echo "Waiting for $url"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            for i in $(seq 1 30); do
              [ "$code" = "200" ] && break
              sleep 10
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            done
            echo "$url -> $code"
            if [ "$code" != "200" ]; then echo "Asset not available: $url"; exit 1; fi
          done

      - name: Generate Android project from twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from ANDROID_KEYSTORE_BASE64 secret"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android.keystore
          else
            echo "No keystore secret found; generating a new keystore"
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore android.keystore -alias needit \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
              -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=NeedIt Studio, OU=Engineering, O=NeedIt, L=Lagos, ST=Lagos, C=NG"
          fi
          "$JAVA_HOME/bin/keytool" -list -keystore android.keystore \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias needit >/dev/null \
            && echo "Keystore ready (alias: needit)"

      - name: Build signed APK and App Bundle
        run: bubblewrap build --skipPwaValidation

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: needit-android
          if-no-files-found: error
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/android.keystore

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: NeedIt Studio Android v1.0.${{ github.run_number }}
          body: |
            Trusted Web Activity (TWA) build of the NeedIt Studio PWA.

            - `app-release-signed.apk` — install on Android (sideload)
            - `app-release-bundle.aab` — for Google Play upload

            Signed with the pinned project keystore, so builds can be installed as updates.
            Digital Asset Links: https://needit-studio.netlify.app/.well-known/assetlinks.json
          files: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
